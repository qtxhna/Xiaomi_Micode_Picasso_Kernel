name: Build Kernel 

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    env:
      KSU_STATUS: "no-KSU"
      BUILD_ARGS: "all"
      AOSP_TOOLCHAIN_BRANCH: "android13"
      AOSP_CLANG_VERSION: "r450784d"

    name: Build (no-KSU)  # 【修复点】去掉了无法识别的 ${{ env.KSU_STATUS }}，直接写死名称

    steps:
    # 1. 拉取内核源码
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
      #  submodules: 'recursive'
        fetch-depth: 1

    # 2. 安装依赖
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
          make curl zip unzip libxml2-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    # 3. 缓存及下载 AOSP Clang
    - name: 缓存Clang
      id: cache-clang
      uses: actions/cache/restore@main
      with:
        path: clang
        key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

    - name: 下载Clang
      id: download_clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p clang
        wget -c -t 10 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" -O clang.tgz
        tar -zxvf clang.tgz -C clang/

    - name: 保存Clang
      if: always() && steps.cache-clang.outputs.cache-hit != 'true' && steps.download_clang.outcome == 'success'
      uses: actions/cache/save@main
      with:
        path: clang
        key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

    # 4. 执行脚本编译
    - name: Build Kernel via Script
      env:
        KBUILD_BUILD_USER: qtxhna
        KBUILD_BUILD_HOST: github-actions
      run: |
        chmod +x build.sh
        echo "Running build command: ./build.sh ${{ env.BUILD_ARGS }}"
        ./build.sh ${{ env.BUILD_ARGS }}

    # 5. 准备打包产物
    - name: Prepare Artifact
      run: |
        mkdir -p ./output
        for file in ../out/AnyKernel3-picasso/Driftwood-Kernel-*.zip; do
          if [ -f "$file" ]; then
            base=$(basename "$file" .zip)
            cp "$file" "./output/${base}-${{ env.KSU_STATUS }}.zip"
          fi
        done

    # 6. 上传编译好的 Zip 卡刷包
    - name: Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Driftwood-Kernel-${{ env.KSU_STATUS }}
        path: ./output/Driftwood-Kernel-*.zip
